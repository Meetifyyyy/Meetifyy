# ─────────────────────────────────────────────────────────────────────────────
# Meetifyy — Continuous Integration
#
# Runs on every Pull Request targeting `development` or `main`, and on every
# push to either of those branches.
#
# Does NOT deploy anything and does NOT connect to any live database.
# Its sole purpose is to catch problems before they reach a deployed environment.
#
# Checks performed:
#   1. Install dependencies
#   2. Generate Prisma client (validates schema.prisma syntax)
#   3. Validate schema.prisma (prisma validate)
#   4. TypeScript typecheck (tsc --noEmit via tsconfig.build.json)
#   5. ESLint            — non-blocking (pre-existing type-safety backlog)
#   6. Production build (nest build)
#   7. Unit tests (jest)
#
# The `mobile` job builds the native bundle from the same `src/` — the app IS
# the website, wrapped — and proves two things about the output: that no service
# worker reached it, and that the marketing landing page did not. Both are
# failures that would otherwise surface only on a device, or not at all.
#
# The API origin is guarded by a unit test rather than by grepping the bundle:
# an earlier version of that step searched for `localhost:NNNN` and failed on a
# default constant inside @supabase/auth-js.
#
# No live database is needed for any of these — schema validation runs offline
# against the committed files only, using the placeholder URLs set below.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Every deployable app is checked here, and one aggregate job reports the result.
#
# Two things were wrong before, and they compounded:
#
#   1. Only `backend/**` was checked. `frontend` and `admin-frontend` — the
#      frontend alone carrying 700+ tests — had no automated gate at all, so a
#      frontend change reached production having been run nowhere but a
#      developer's machine.
#
#   2. `main` requires a status check named `validate`, but the job published
#      its check as "Lint · Typecheck · Build · Test". No check by the required
#      name was ever produced, so the requirement sat at "Expected" forever and
#      every merge to main had to bypass branch protection. Protection that must
#      be bypassed to ship is worse than none: it trains people to click past it.
#
# Hence the `validate` job at the bottom. It runs nothing itself; it exists so
# there is exactly one required check whose name is stable, that is always
# produced, and that is green only when all three app jobs are. Adding a fourth
# app later means adding it to `needs` — the branch protection rule never has to
# change again.
#
# `paths` filters are deliberately absent. A required check that is skipped is
# not reported as passed, it is reported as pending, so a path-filtered required
# check deadlocks every PR that does not touch those paths. The jobs are a few
# minutes; correctness here is worth more than the saving.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    # Placeholder connection strings. No step here talks to a real database,
    # but the Prisma CLI resolves `env()` in the datasource block before it
    # does anything at all — including `validate` — and hard-fails with P1012
    # if the vars are unset. Declared at job level so every step inherits them.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Validates schema.prisma syntax without connecting to any database.
      - name: Prisma generate (schema validation)
        run: npx prisma generate

      - name: Prisma schema validation
        run: npx prisma validate

      - name: TypeScript typecheck
        run: npx tsc --project tsconfig.build.json --noEmit

      # Non-blocking: formatting and parse errors are clean, but ~4.6k
      # pre-existing `no-unsafe-*` findings remain. Flip to blocking once
      # that backlog is worked down.
      - name: ESLint
        run: npm run lint
        continue-on-error: true

      # prebuild script runs `prisma generate` again — harmless, ensures the
      # dist output matches the latest generated client.
      - name: Production build
        run: npm run build

      # The suite is fully mocked and opens no network connections. The env
      # below exists because `src/config` validates the whole environment at
      # import time, so a missing var throws before any test body runs.
      - name: Unit tests
        run: npm test -- --passWithNoTests
        env:
          APP_ENV: test
          NODE_ENV: test
          FRONTEND_URL: "http://localhost:3000"
          REDIS_URL: ""
          SUPABASE_URL: "https://ci-placeholder.supabase.co"
          SUPABASE_ANON_KEY: "ci_placeholder_anon_key"
          SUPPORT_IP_HASH_SALT: "ci_placeholder_salt"

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # BLOCKING, unlike the full lint below, and deliberately narrow.
      #
      # src/core/ and src/platform/ are the code a second client will run, and
      # what makes them reusable is not where they sit but what they are
      # forbidden to touch: no DOM, no import.meta.env, no imports back into the
      # app, no Capacitor outside platform/capacitor/. Those rules are errors in
      # eslint.config.js, but the full lint runs with continue-on-error because
      # of an unrelated warning backlog — so without a separate step they would
      # be reported and ignored.
      #
      # `--max-warnings 0` because these two directories are new and have no
      # backlog to grandfather. Keeping them at zero is cheap now and expensive
      # later.
      - name: Architecture boundaries (core/ and platform/)
        run: npx eslint src/core src/platform --max-warnings 0

      # The two TypeScript contract files — platform/contracts.ts and
      # core/navigation/intents.ts. They are contracts between implementations
      # that never import each other, so nothing at runtime can catch a mismatch
      # between them, which is the whole reason they are typed. A script nothing
      # runs is a script that rots.
      - name: Typecheck contracts
        run: npm run typecheck

      # Non-blocking for the same reason as the backend: the current tree is
      # error-free but carries unused-variable warnings.
      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      # Exercises the whole pipeline, not just Vite: robots, sitemap, the
      # version stamp and the SEO prerender all run here, and each has broken
      # a deploy before.
      - name: Production build
        run: npm run build

      # The mirror of the mobile job's check. The landing page is the website's
      # front door for someone who has never heard of Meetifyy, and a gating
      # mistake that removed it from the web build would be just as silent as
      # one that added it to the app.
      - name: Landing page IS in the web bundle
        run: |
          set -e
          if ! ls dist/assets/LandingPage-*.js >/dev/null 2>&1; then
            echo "::error::the landing page is missing from the web bundle"
            exit 1
          fi
          echo "landing page present in dist/"

      # The native plugins must not reach the website. This is not theoretical:
      # `@aparajita/capacitor-secure-storage` calls registerPlugin() at module
      # scope, which is a side effect Rollup has to preserve, so a static import
      # survived tree-shaking even though IS_MOBILE_BUILD folded away the only
      # branch that used it — and the plugin plus @capacitor/core shipped to
      # production web. Caught by hand once; this is what catches it next time.
      - name: No Capacitor code in the web bundle
        run: |
          set -e
          if grep -rl -e 'aparajita' -e '@capacitor' dist/assets/ >/dev/null 2>&1; then
            echo "::error::Capacitor code reached the web bundle"
            grep -rl -e 'aparajita' -e '@capacitor' dist/assets/ || true
            exit 1
          fi
          echo "no Capacitor code in dist/"

  # ── Mobile build target ─────────────────────────────────────────────────────
  #
  # Runs on every change to the frontend, because the mobile bundle is built
  # from the same `src/` as the web one: a change to `core/` or `platform/`
  # reaches both, and a change to a web-only file still has to leave this build
  # working. Path filtering across the two targets belongs with Phase 5, when
  # `src/mobile/` holds a UI that can be changed on its own — filtering now
  # would only mean a job that skips itself while there is nothing to skip.
  mobile:
    name: mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      # A native build has no same-origin API to fall back to, so
      # createCapacitorApiOrigin refuses to construct without this. The value is
      # only ever inlined into a bundle CI throws away.
      VITE_API_URL: https://api.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build mobile bundle
        run: npm run build:mobile

      # BLOCKING, and the reason this job exists.
      #
      # A caching service worker inside a WebView can serve its copy of the
      # DEPLOYED SITE instead of the bundle the store reviewed, and iOS has no
      # service worker support at all. The mobile Vite config does not load
      # vite-plugin-pwa, so the code is absent rather than skipped by a runtime
      # check — this proves the absence rather than trusting it.
      #
      # The patterns are deliberately narrow. An earlier version grepped for the
      # bare string `serviceWorker`, which matched a diagnostic line in the
      # mobile shell that only NAMED the API. A guard its own placeholder trips
      # is a guard nobody will trust.
      - name: No service worker in the mobile bundle
        run: |
          set -e
          if [ -f dist-mobile/sw.js ]; then
            echo "::error::dist-mobile/sw.js exists — a service worker must never ship in the native bundle"
            exit 1
          fi
          if grep -rlq "workbox" dist-mobile/; then
            echo "::error::workbox found in dist-mobile/ — vite-plugin-pwa has leaked into the mobile target"
            grep -rl "workbox" dist-mobile/
            exit 1
          fi
          if grep -rlqE "serviceWorker\.register|serviceWorker\[.register" dist-mobile/; then
            echo "::error::service-worker registration found in dist-mobile/"
            grep -rlE "serviceWorker\.register|serviceWorker\[.register" dist-mobile/
            exit 1
          fi
          echo "no service worker in dist-mobile/"

      # Blocker B1 — the API origin — is guarded by a unit test rather than by
      # grepping the bundle. The first version of this step searched for
      # `localhost:NNNN` and failed on `http://localhost:9999`, a default
      # constant inside @supabase/auth-js. A check that fires on a vendor string
      # teaches people to ignore it, and the property worth asserting is about
      # what createCapacitorApiOrigin RETURNS, which a test can state exactly:
      # see src/platform/capacitor/__tests__/apiOrigin.test.js, run by the
      # frontend job.

      # The app replaces the website's `/` with its own opening screen, so the
      # marketing landing page must not be in the native bundle.
      #
      # This is a guard against a specific, silent regression. The exclusion
      # depends on gating the lazy import with the folding constant
      # IS_MOBILE_BUILD; writing that branch against `config.client` instead
      # looks identical, still works, and quietly ships the landing page to the
      # app and the native API origin to the website. That is exactly what
      # happened the first time it was written.
      - name: Landing page is not in the mobile bundle
        run: |
          set -e
          if ls dist-mobile/assets/LandingPage-*.js >/dev/null 2>&1; then
            echo "::error::the marketing landing page reached the native bundle — check that IS_MOBILE_BUILD (not config.client) gates its import in src/App.jsx"
            ls dist-mobile/assets/LandingPage-*.js
            exit 1
          fi
          echo "no landing page in dist-mobile/"

      - name: Report bundle size
        run: |
          bytes=$(find dist-mobile -type f -printf '%s\n' | paste -sd+ | bc)
          echo "dist-mobile: $bytes bytes ($((bytes / 1024)) KiB)"

  admin-frontend:
    name: admin-frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # oxlint, not ESLint — this app has no flat ESLint config.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # `npm run build` is `tsc -b && vite build`, so the typecheck is the
      # first half of this step rather than a separate one.
      - name: Typecheck and build
        run: npm run build

  # ── The single required status check ────────────────────────────────────────
  # Named to match the context `main` requires. Do not rename without updating
  # the branch protection rule, or merges will block on a check that no longer
  # exists.
  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, admin-frontend]
    # Runs even when a dependency fails, so the required check reports a real
    # failure instead of being skipped — a skipped required check reads as
    # pending forever.
    if: always()

    steps:
      - name: Verify every app passed
        run: |
          echo "backend:        ${{ needs.backend.result }}"
          echo "frontend:       ${{ needs.frontend.result }}"
          echo "mobile:         ${{ needs.mobile.result }}"
          echo "admin-frontend: ${{ needs['admin-frontend'].result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.mobile.result }}" != "success" ] \
            || [ "${{ needs['admin-frontend'].result }}" != "success" ]; then
            echo "::error::One or more app checks did not succeed."
            exit 1
          fi
          echo "All app checks passed."
