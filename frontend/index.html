  <link rel="apple-touch-icon" href="/favicon.png?v=2" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Meetifyy" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http: https: http://localhost:4000 http://127.0.0.1:4000; media-src 'self' data: blob: http: https: http://localhost:4000 http://127.0.0.1:4000; connect-src 'self' http: https: ws: wss:;" />
  <meta name="description" content="Meetifyy — your vibe, your tribe, your spotlight. Connect with like-minded people, join communities, and build your network." />
  <link rel="preload" href="/fonts/inter-100_900-normal-13.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/changaone-400-normal-15.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/changa-400-normal-18.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/materialsymbolsoutlined-100_700-normal-31.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles/fonts.css" />
  <script>
    if (window.location.hostname === 'meetify-web.vercel.app') {
      window.location.replace('https://dev.meetifyy.app' + window.location.pathname + window.location.search);
    }
  </script>
  <title>Meetifyy</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Cache breaker — runs before React. Nukes stale SWs and caches on version change.
    // Increment this value on any SW architecture change to force a clean slate.
    (function(){
      var SW_VERSION = '2';
      var key = 'meetifyy_sw_v';
      try {
        if (localStorage.getItem(key) !== SW_VERSION) {
          localStorage.setItem(key, SW_VERSION);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
          if (performance.navigation && performance.navigation.type !== 1) {
            location.reload();
            return;
          }
        }
      } catch(e) {}
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
