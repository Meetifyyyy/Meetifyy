<!DOCTYPE html>
<!-- data-theme is set by the boot script below, from the device preference. -->
<html lang="en" style="scrollbar-gutter: stable;">
<head>
  <meta charset="UTF-8" />
  <!--
    No `maximum-scale` and no `user-scalable=no`.

    Both were here to stop iOS zooming in when a text field smaller than 16px is
    focused. The cost was that Android Chrome honours `user-scalable=no`
    literally and refused to pinch-zoom at all, which is a WCAG 2.1 AA failure
    (1.4.4 Resize Text) and a Lighthouse accessibility error. It takes zoom away
    from exactly the people who most need it, to avoid an annoyance that
    reverses itself the moment the field is blurred.

    There is no setting that gives both, so the accessibility outcome wins.
    global.css adds a 16px floor for form controls on touch devices, which
    removes the focus-zoom for every field a component has not sized itself;
    fields styled below 16px by their own component still zoom on focus. See the
    note there for why that floor deliberately does not override components.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <!--
    The one favicon, and deliberately the only `rel="icon"`.

    `sizes` has to tell the truth: this file is 192x192 and was declared
    32x32, a size Google rejects outright (it wants a square multiple of 48px).
    That plus a missing /favicon.ico left it nothing to use, which is why
    results showed the generic globe.

    `logo-192.png` used to be declared here too. It is the full-bleed tile
    carrying the wordmark — illegible at 16-48px and clipped by any rounded
    crop — and listing it gave Google a second candidate that would have
    looked worse than no logo. It stays in the web manifest, where a
    home-screen tile is exactly what is wanted, and out of the favicon
    choice entirely.

    Two cuts of the mark, because the two surfaces crop differently:

      favicon.png  full bleed — browser tabs and bookmarks draw a favicon in a
                   square, so the mark should use the whole box there.
      favicon.ico  inset to 80% of the inscribed circle — search results and
                   profile chips draw it in a circle, which at full bleed was
                   shaving the shoulders off the M.

    Google reads this declaration first and only falls back to /favicon.ico
    when it finds nothing usable here, so it will most likely pick the
    full-bleed cut and crop it. That is a deliberate trade: the tab icon is
    seen constantly and the search icon rarely. If the clipped result in search
    matters more, point this href at the .ico and the circular cut wins
    everywhere.
  -->
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2" />
  <!--
    The maskable (opaque, full-bleed) icon, not the rounded one. iOS does not
    honour transparency in an apple-touch-icon — it composites the image onto
    black — so a rounded icon with cut-out corners gets black corners on the
    home screen. iOS applies its own squircle anyway, so it wants a plain
    opaque square.
  -->
  <link rel="apple-touch-icon" href="/logo-192-maskable.png?v=3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Meetifyy" />
  <meta name="theme-color" content="#2563EB" />

  <!--
    Decide the theme BEFORE the first paint.

    Blocking and inline on purpose. `ThemeContext` applies `data-theme` from
    React, which is after the browser has already painted, so anything decided
    there is a visible flash of the wrong theme. The rule it implements is
    `core/theme/resolveTheme.js`, which is where it is written down and tested;
    this cannot import that module because it runs before any bundle exists,
    and THAT is why the rule is a named function with tests rather than a line
    of code in two HTML files.

    `theme_preference_set` is written only by `toggleTheme`, so it means the
    user actually chose. `localStorage.theme` alone does not: it is rewritten on
    every theme change including the ones this causes, so honouring it would
    follow the device exactly once and then freeze.
  -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var chose = localStorage.getItem('theme_preference_set') === 'true';
        var saved = localStorage.getItem('theme');
        if (chose && (saved === 'light' || saved === 'dark')) {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {}
      var bg = theme === 'dark' ? '#000000' : '#FFFFFF';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      document.documentElement.style.setProperty('--launch-bg', bg);
      document.documentElement.style.background = bg;
      document.documentElement.style.scrollbarGutter = 'stable';
    })();
  </script>
  <style>
    html {
      overflow-x: clip;
      scrollbar-gutter: stable;
    }
    @supports not (scrollbar-gutter: stable) {
      @media (min-width: 769px) {
        html {
          overflow-y: scroll;
        }
      }
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    html, body {
      scrollbar-width: thin;
    }
    @media (pointer: coarse) {
      html, body {
        scrollbar-width: none !important;
      }
      ::-webkit-scrollbar {
        width: 0 !important;
        height: 0 !important;
        display: none !important;
      }
    }
    :root {
      --launch-bg: #FFFFFF;
    }
    [data-theme="dark"] {
      --launch-bg: #000000;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --launch-bg: #000000;
      }
    }
    #launch-shell {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--launch-bg, #FFFFFF);
      transition: opacity 0.25s ease;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .launch-logo {
      width: clamp(120px, 18vw, 160px);
      height: clamp(120px, 18vw, 160px);
      object-fit: contain;
      display: block;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>

  <!--
    iOS does not generate a launch image the way Android does. Without an
    `apple-touch-startup-image` whose media query matches the device exactly, a
    home-screen install shows a blank white screen on every launch. One entry
    per real device geometry; generated by `npm run pwa:assets`.
  -->
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-430x932@3x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-428x926@3x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-414x896@3x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-414x896@2x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-414x736@3x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-393x852@3x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-390x844@3x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-375x812@3x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-375x667@2x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-320x568@2x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-1024x1366@2x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-834x1194@2x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-834x1112@2x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-820x1180@2x.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-768x1024@2x.png" />
  <!-- DEV-CSP:START -->
  <!--
    The DEV SERVER's policy, and only the dev server's.

    Vite serves this file directly with no opportunity to set response headers,
    so the dev server needs its policy in the document. That policy necessarily
    allows http://localhost:4000 and http://127.0.0.1:4000 for the local API,
    which has no business being advertised by the public site.

    In a deployed build the real policy is the `Content-Security-Policy` HEADER
    in vercel.json, which is strictly tighter: no localhost, no cdn.jsdelivr.net.
    Leaving this tag in production did not weaken anything, because a browser
    enforces every policy it is given and the effective permission is the
    intersection of the two. It did publish localhost origins in every page of
    the public site, and it invited someone to "fix" a CSP problem by editing
    the loose copy.

    `stripDevCspPlugin` in vite.config.js removes this block from production
    builds, leaving the header as the single policy.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http: https: http://localhost:4000 http://127.0.0.1:4000; media-src 'self' data: blob: http: https: http://localhost:4000 http://127.0.0.1:4000; connect-src 'self' http: https: ws: wss:;" />
  <!-- DEV-CSP:END -->
  <link rel="preload" href="/fonts/inter-100_900-normal-13.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/changaone-400-normal-15.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/changa-400-normal-18.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles/fonts.css" />
  <!-- DEV-HOST-GUARD:START -->
  <!--
    Client-side backstop for the same hop vercel.json performs at the edge:
    the development project's generated *.vercel.app URL sends visitors to the
    real dev hostname.

    Stripped entirely from production builds by `stripDevHostGuardPlugin` in
    vite.config.js. On meetifyy.app the condition can never be true, so it is
    dead code there, and dead code that hardcodes the development hostname into
    every production document. Google does not parse URLs out of script strings,
    so it was not a crawlable link, but the rule is that no production artefact
    names a non-production host, and an exception nobody can justify is one
    somebody will later copy.
  -->
  <script>
    if (window.location.hostname === 'meetify-web.vercel.app') {
      window.location.replace('https://dev.meetifyy.app' + window.location.pathname + window.location.search);
    }
  </script>
  <!-- DEV-HOST-GUARD:END -->

  <!--
    Everything between SEO:START and SEO:END is REPLACED PER ROUTE at build time
    by scripts/prerender-seo.mjs, which writes one real HTML file per public
    page. Do not add anything here that is not route-specific metadata, and do
    not remove the markers: the prerender step fails the build without them.

    The values below are the homepage's, and they are what the Vite dev server
    serves for every route. That is intentional and harmless, because no crawler
    ever reaches a dev server. In a built deployment this file is overwritten
    with the homepage block, and every other route gets its own document.

    Copy rules live in src/config/seo.js. In short: no em dashes, one pipe at
    most, and a description written for this page and no other.
  -->
  <!-- SEO:START -->
  <title>Meetifyy | Discover People, Communities and Events</title>
  <meta name="description" content="Meetifyy brings students together around what they actually care about. Join communities, find events on campus, and meet people worth knowing." />
  <meta name="robots" content="noindex, nofollow" />
  <!-- SEO:END -->
</head>
<body>
  <!--
    Launch shell. The platform splash is dismissed the moment the page paints,
    which happens long before React has mounted — so without this there is a
    flash of empty page between the splash and the first screen.
    Pure white in light mode (#FFFFFF), pure black in dark mode (#000000).

    Inline and markup-only on purpose: it has to be on screen at first paint,
    which rules out anything that waits on the bundle or a stylesheet.
  -->
  <div id="launch-shell" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:var(--launch-bg,#FFFFFF);transition:opacity .25s ease;pointer-events:none">
    <img class="launch-logo" src="/logo.png" alt="Meetifyy" width="160" height="160" style="width:clamp(120px,18vw,160px);height:clamp(120px,18vw,160px);object-fit:contain;display:block;background:transparent;border:0;outline:none" />
  </div>

  <div id="root"></div>
  <script>
    /**
     * Launch-time version gate.
     *
     * Runs before React, while the logo shell above is on screen, and is the
     * ONLY place the app checks whether it is current. An already-open session
     * is never interrupted: no polling, no banner, no mid-session reload. The
     * moment someone reloads, opens a new tab or cold-starts the installed PWA,
     * they pass through here and land on the live build.
     *
     * It replaces a hand-bumped `SW_VERSION` constant that cleared caches
     * asynchronously — so it neither knew what was actually deployed nor
     * finished before the old assets were already loading.
     *
     * HOW IT DECIDES
     * `BUILD` is stamped into this HTML at build time; `/version.json` is
     * written by the same build and served no-store. Different values mean the
     * document that booted this page is not the deployed one.
     *
     * FAILING OPEN
     * An unknown version, a failed fetch or a slow network all proceed
     * normally. The alternative — blocking or reloading when the check cannot
     * complete — would break the app offline and on bad connections, which is
     * far worse than briefly running a build that is one deploy behind.
     *
     * NOT LOOPING
     * A forced reload is recorded against the version it was for, so a client
     * that reloads and still reads the old version (a CDN mid-propagation, say)
     * gives up rather than reloading forever.
     */
    (function () {
      var BUILD = '__MEETIFYY_BUILD_VERSION__';
      var TIMEOUT_MS = 2500;
      var TRIED_KEY = 'meetifyy_version_reload_for';

      // Held while a forced update is in flight so the shell cannot lift and
      // reveal a half-old app. Cleared the instant we decide not to reload.
      window.__meetifyyVersionGate = { pending: true };
      function release() {
        window.__meetifyyVersionGate.pending = false;
      }

      // No stamp (a direct `vite build`, or the dev server) — nothing to compare.
      if (!BUILD || BUILD.indexOf('__MEETIFYY') === 0) return release();
      if (!('fetch' in window)) return release();

      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) { settled = true; release(); }
      }, TIMEOUT_MS);

      function proceed() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        release();
      }

      /**
       * Clears every cache, promotes a waiting worker, then reloads.
       *
       * Order matters. Caches go first, so nothing can answer the reload from a
       * stale entry. The waiting worker is promoted next — `skipWaiting` here is
       * safe precisely because it happens at this checkpoint, before any lazy
       * chunk has been requested, which is the hazard that keeps it out of the
       * worker's install path. `clients.claim()` in sw.js then puts the new
       * worker in control of the page that comes back.
       */
      function forceUpdate(latest) {
        try { sessionStorage.setItem(TRIED_KEY, latest); } catch (e) {}

        var work = [];

        if ('caches' in window) {
          work.push(
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            }).catch(function () {})
          );
        }

        if ('serviceWorker' in navigator) {
          work.push(
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (!reg) return;
              var next = reg.waiting || reg.installing;
              if (next) {
                // The worker's message handler calls skipWaiting for us.
                try { next.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
              }
              // `update()` also covers the case where the new worker has not
              // been discovered yet, which is the common one on a cold start.
              return reg.update().catch(function () {});
            }).catch(function () {})
          );
        }

        // Bounded: a hung cache or worker call must not strand the user on the
        // logo. The reload is what matters, and it is safe to do regardless.
        var bounded = new Promise(function (resolve) { setTimeout(resolve, 1500); });

        Promise.race([Promise.all(work), bounded]).then(function () {
          var url = new URL(window.location.href);
          // Defeats any intermediary still holding the old document.
          url.searchParams.set('_v', latest.slice(0, 12));
          window.location.replace(url.toString());
        });
      }

      fetch('/version.json', { cache: 'no-store', credentials: 'omit' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          var latest = data && data.version;
          if (settled) return;
          if (!latest || latest === BUILD) return proceed();

          var tried = null;
          try { tried = sessionStorage.getItem(TRIED_KEY); } catch (e) {}
          // Already forced a reload for this exact version and still stale:
          // reloading again would not help.
          if (tried === latest) return proceed();

          settled = true;
          clearTimeout(timer);
          forceUpdate(latest);
        })
        .catch(function () { proceed(); });
    })();
  </script>
  <script>
    // Auto-recovery handler: catches module script load / MIME type / chunk errors early
    window.addEventListener('error', function(e) {
      var msg = (e && (e.message || (e.error && e.error.message))) || '';
      var isMimeOrChunkError =
        msg.indexOf('Failed to load module script') !== -1 ||
        msg.indexOf('MIME type') !== -1 ||
        msg.indexOf('Strict MIME type checking') !== -1 ||
        msg.indexOf('Loading chunk') !== -1 ||
        msg.indexOf('dynamically imported module') !== -1;

      if (isMimeOrChunkError) {
        try {
          var reloadKey = 'meetifyy_reloaded_mime_error';
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
            var url = new URL(window.location.href);
            url.searchParams.set('_v', Date.now().toString());
            window.location.replace(url.toString());
          }
        } catch(_) {}
      }
    }, true);
  </script>
  <script>
    /**
     * When the launch shell lifts.
     *
     * It used to lift on React's first paint: a MutationObserver watched #root
     * and dismissed the moment anything was appended. React appends its first
     * frame long before the app knows whether anybody is signed in, so the
     * shell came down over an app that was still deciding — and the route
     * gates, asked to render something against an unknown session, rendered the
     * public landing page. A few hundred milliseconds later the session
     * resolved and the app replaced it. That is the flash of landing page on
     * refresh.
     *
     * The rule now is: the shell stays until the app SAYS it is ready.
     * `window.__meetifyyBoot.ready()` is called once, from React, when
     * authentication has been determined one way or the other. React still has
     * to have painted — both conditions, not either.
     *
     * MIN_VISIBLE_MS exists for the opposite failure. A warm cache and a fast
     * session probe can finish in well under 200ms, and a logo that appears and
     * vanishes inside a couple of frames reads as a flicker in its own right
     * rather than as a loading screen. Holding it to a floor makes the handoff
     * deliberate. 450ms is about the shortest span that still registers as "it
     * was loading" rather than "something flashed"; it is a floor and never an
     * addition, so any boot that genuinely takes longer pays nothing for it.
     *
     * The 8s backstop is unchanged and ignores every flag: a boot that never
     * reports ready — a failed bundle, a hung request — must still reach the
     * error UI rather than leave someone staring at a logo.
     */
    (function () {
      var MIN_VISIBLE_MS = 450;
      var shownAt = Date.now();
      var shell = document.getElementById('launch-shell');

      // Declared whether or not the shell exists, so the app can always call it.
      window.__meetifyyBoot = {
        appReady: false,
        ready: function () {
          window.__meetifyyBoot.appReady = true;
          if (shell) dismiss();
        }
      };

      if (!shell) return;

      // ── Scroll lock ─────────────────────────────────────────────────────────
      // Prevent all forms of scrolling while the launch shell is on screen.
      // Matches the strategy used by useScrollLock in the React layer:
      // overflow:hidden then overflow:clip on <html> keeps it a non-scroll-
      // container so position:sticky elements are not affected.
      var _htmlOverflow = document.documentElement.style.overflow;
      var _bodyOverflow = document.body.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'clip';
      document.body.style.overflow = 'hidden';
      document.body.style.overflow = 'clip';

      // Block mouse-wheel scrolling.
      function _blockWheel(e) { e.preventDefault(); }
      // Block touch scrolling on the underlying page (multi-touch exempted so
      // pinch-zoom is preserved, matching handleTouchMove in useScrollLock).
      function _blockTouch(e) {
        if (e.touches && e.touches.length > 1) return;
        if (e.cancelable) e.preventDefault();
      }
      // Block keyboard scrolling keys (arrows, space, page up/down, home, end).
      var _scrollKeys = { 32:1, 33:1, 34:1, 35:1, 36:1, 37:1, 38:1, 39:1, 40:1 };
      function _blockKeys(e) {
        if (_scrollKeys[e.keyCode]) e.preventDefault();
      }

      document.addEventListener('wheel',     _blockWheel, { passive: false });
      document.addEventListener('touchmove', _blockTouch, { passive: false });
      document.addEventListener('keydown',   _blockKeys,  { passive: false });

      function _releaseScrollLock() {
        document.documentElement.style.overflow = _htmlOverflow;
        document.body.style.overflow            = _bodyOverflow;
        document.removeEventListener('wheel',     _blockWheel, { passive: false });
        document.removeEventListener('touchmove', _blockTouch, { passive: false });
        document.removeEventListener('keydown',   _blockKeys,  { passive: false });
      }
      // ── End scroll lock ──────────────────────────────────────────────────────

      var done = false;
      var root = document.getElementById('root');
      var observer = new MutationObserver(function () { dismiss(); });

      function dismiss(force) {
        if (done) return;

        if (!force) {
          // Held while the version gate is deciding, or while a forced update
          // is in flight. Lifting now would show the old app for a moment and
          // then reload out from under it — the "mix of old and new" this
          // exists to prevent. The gate always releases (it fails open on any
          // error and has its own timeout).
          if (window.__meetifyyVersionGate && window.__meetifyyVersionGate.pending) {
            setTimeout(dismiss, 100);
            return;
          }
          // Nothing behind the shell yet.
          if (!root || root.childElementCount === 0) return;
          // The app has not finished working out who is signed in.
          if (!window.__meetifyyBoot.appReady) return;

          var elapsed = Date.now() - shownAt;
          if (elapsed < MIN_VISIBLE_MS) {
            setTimeout(dismiss, MIN_VISIBLE_MS - elapsed);
            return;
          }
        }

        done = true;
        observer.disconnect();
        // Restore scrolling immediately — before the fade — so the page is
        // interactive the instant the shell starts to lift.
        _releaseScrollLock();
        shell.style.opacity = '0';
        setTimeout(function () { shell.remove(); }, 300);
      }

      observer.observe(root, { childList: true });
      dismiss();
      setTimeout(function () { dismiss(true); }, 8000);
    })();
  </script>
