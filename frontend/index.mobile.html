<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!--
    viewport-fit=cover, which the web entry deliberately does NOT carry.

    `env(safe-area-inset-*)` is used across global.css and several component
    stylesheets, and without this it resolves to 0 — so every one of those rules
    is inert on a notched device. Adding it to index.html instead would activate
    all of them at once for every already-installed PWA user, which is a live
    layout change to the website and belongs in its own ticket with a visual
    check. Here it is simply correct from the start.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

  <meta name="theme-color" content="#2563EB" />
  <!--
    Without this the WebView assumes a light page and paints a WHITE blank frame
    before any CSS lands, which is a flash of white on a dark-mode device.
  -->
  <meta name="color-scheme" content="light dark" />
  <title>Meetifyy</title>

  <!--
    Decide the theme BEFORE the first paint.

    This must be a blocking inline script in <head>. `ThemeContext` applies
    `data-theme` from React, which is hundreds of milliseconds after the WebView
    has already painted something — so the launch shell, and the first frame of
    the app behind it, were drawn light and then snapped to dark. On the video
    that is the pale flash between the logo and the opening screen.

    The same value `ThemeContext` persists (`localStorage.theme`), falling back
    to the OS preference, so this never disagrees with what React decides a
    moment later. Wrapped in try/catch because storage can throw, and a theme is
    not worth failing a boot over.

    `--launch-bg` is consumed by the shell below AND reported to the native
    layer, which paints the same colour behind the WebView. Three surfaces, one
    value.
  -->
  <script>
    (function () {
      var bg = '#FFFFFF';
      var theme = 'light';
      try {
        // `theme_preference_set` is written only by toggleTheme, so it means
        // the user actually chose. `theme` alone does not: it is rewritten on
        // every change including the ones this causes, so honouring it would
        // follow the device exactly once and then freeze. Same rule as
        // core/theme/resolveTheme.js and index.html.
        var chose = localStorage.getItem('theme_preference_set') === 'true';
        var saved = localStorage.getItem('theme');
        if (chose && (saved === 'light' || saved === 'dark')) {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {}

      if (theme === 'dark') bg = '#000000';

      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      document.documentElement.style.setProperty('--launch-bg', bg);
      document.documentElement.style.background = bg;
      window.__meetifyyLaunchBg = bg;
    })();
  </script>

  <!--
    WHAT IS DELIBERATELY ABSENT, and why, because each omission is a decision:

    • The launch-time version gate. It fetches /version.json and compares it
      against the build stamped into this document, to decide whether the tab is
      running a stale deployment. A bundled app has no deployment to be stale
      against — the file ships inside the binary, so the comparison can only
      ever say "current". Updates arrive through the store.

    • Every service-worker reference. The mobile Vite config does not load
      vite-plugin-pwa at all, so there is no worker to register; this is the
      second half of that, and the reason the guard is structural rather than a
      runtime `if`. A caching worker inside a WebView could serve its copy of
      the DEPLOYED SITE instead of the reviewed app, and iOS has no service
      worker support to begin with.

    • The dev-host guard. It forwards a generated *.vercel.app URL to the dev
      hostname. There is no such URL here.

    • The CSP meta tag. The web one exists for the dev server and is stripped
      from production builds; it is far too permissive to ship natively
      (`unsafe-inline`, `unsafe-eval`, `connect-src http: https: ws: wss:`).
      A native policy belongs in the native layer, where it can be tight.

    • The SEO block and the fifteen apple-touch-startup-image links. Nothing
      crawls an app bundle, and the platform draws the splash itself.
  -->

  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="preload" href="/fonts/inter-100_900-normal-13.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/changaone-400-normal-15.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/changa-400-normal-18.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles/fonts.css" />
</head>
<body>
  <div id="root"></div>

  <script>
    /**
     * Reports when the app is ready, for the NATIVE splash to stand down.
     *
     * THERE IS NO HTML SPLASH HERE, DELIBERATELY.
     *
     * There used to be: a full-screen div with the mark, which the system
     * splash handed over to. That was two splash screens, and they did not
     * match — Android draws the splash icon in a 240dp container while this
     * one drew the same PNG at `min(38vw,160px)`, inside which the mark is only
     * 46% of the image. The result was a large logo, then a small logo, then
     * the app. Making the two agree on a size would have been a fix for the
     * symptom; there is simply no reason for a second one to exist.
     *
     * So the native splash stays up until the app is genuinely ready, and this
     * is the only thing it waits for. `MainActivity` polls `appReady` — see
     * `setKeepOnScreenCondition` there. Nothing is rendered by this file.
     *
     * `ready()` is called by AuthContext once authentication has been DECIDED,
     * not merely once React has painted. Lifting on first paint shows the
     * signed-out screen for a moment to somebody who is signed in, because the
     * route gates are being asked a question the app cannot answer yet.
     *
     * The window behind the WebView is painted the same colour as the splash
     * (see MainActivity), so there is nothing to see between the two even if
     * the backstop fires.
     */
    window.__meetifyyBoot = {
      appReady: false,
      ready: function () {
        window.__meetifyyBoot.appReady = true;
      }
    };
  </script>

  <script type="module" src="/src/mobile/main.jsx"></script>
</body>
</html>
