<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No connection · Meetifyy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e4e4ef;
      font-family: 'Inter', system-ui, sans-serif;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(130,80,255,0.12);
      border: 1.5px solid rgba(130,80,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p { color: #9494aa; font-size: 0.93rem; max-width: 26ch; line-height: 1.6; }
    button {
      margin-top: 0.5rem;
      padding: 0.6rem 1.8rem;
      border-radius: 999px;
      border: 1.5px solid rgba(130,80,255,0.4);
      background: transparent;
      color: #c4b5fd;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(130,80,255,0.1); border-color: rgba(130,80,255,0.7); }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>No connection</h1>
  <p>Check your network and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
